name: Validate knowledge base

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate structured content and local references
        run: pnpm run validate

      - name: Build public-safe static preview
        run: pnpm run build

      - name: Upload public-safe preview artefact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-public-safe-preview
          path: _site
          if-no-files-found: error
