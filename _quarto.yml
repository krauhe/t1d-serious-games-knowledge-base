project:
  type: website
  output-dir: _site
  pre-render:
    - node tools/sync-physiology.mjs
  resources:
    - figures/original/pixel-landscape-background.png
    - figures/original/pixel-arcade-biomes-background.png
    - figures/original/t1d-serious-games-header-icon.png
    - figures/original/t1d-serious-games-header-mark.png
    - figures/original/t1d-serious-games-pixel-mark.png
    - assets/fonts/PressStart2P-Regular.ttf
    - assets/fonts/OFL.txt

website:
  title: "T1D Serious Games Knowledge Base"
  description: "Scientific evidence, game profiles, learning design, physiology, evaluation, and sustainability guidance for serious games relevant to type 1 diabetes."
  favicon: figures/original/t1d-serious-games-header-icon.png
  repo-url: https://github.com/krauhe/t1d-serious-games-knowledge-base
  repo-actions: [issue]
  search:
    location: sidebar
    type: overlay
  reader-mode: true
  page-navigation: true
  page-footer:
    center: "Original content and data: [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Software: [MIT](LICENSE) · © 2026 Kristian Rauhe Harreby"
  sidebar:
    logo: figures/original/t1d-serious-games-header-icon.png
    style: docked
    collapse-level: 1
    contents:
      - section: "Start here"
        contents:
          - index.qmd
          - glossary.qmd
      - section: "Games and evidence"
        contents:
          - text: "Game catalogue"
            href: explorer.html
          - knowledge/games/index.qmd
          - knowledge/games/evidence-map.qmd
          - knowledge/games/availability.qmd
          - knowledge/comparisons/comparative-analysis.qmd
      - section: "Learning and design"
        contents:
          - knowledge/design/index.qmd
          - knowledge/design/learning-science.qmd
          - knowledge/design/game-mechanisms.qmd
          - knowledge/design/evaluation.qmd
          - knowledge/human-factors/onboarding-and-accessibility.qmd
      - section: "T1D Physiology and Modelling"
        contents:
          - knowledge/physiology/index.qmd
          - knowledge/physiology/glucose-insulin-system.qmd
          - knowledge/physiology/meals-insulin-exercise.qmd
          - knowledge/physiology/variability-and-safety.qmd
          - knowledge/physiology/model-families.qmd
          - knowledge/physiology/reference/01-glucose-distribution.qmd
          - knowledge/physiology/reference/02-hepatic-glucose-production.qmd
          - knowledge/physiology/reference/03-renal-glucose-handling.qmd
          - knowledge/physiology/reference/04-brain-glucose-consumption.qmd
          - knowledge/physiology/reference/05-carbohydrates.qmd
          - knowledge/physiology/reference/06-fat-and-protein.qmd
          - knowledge/physiology/reference/07-insulin-pharmacology.qmd
          - knowledge/physiology/reference/08-aerobic-exercise.qmd
          - knowledge/physiology/reference/09-anaerobic-exercise.qmd
          - knowledge/physiology/reference/10-exercise-inflammation.qmd
          - knowledge/physiology/reference/10b-relaxation-yoga.qmd
          - knowledge/physiology/reference/11-counterregulatory-hormones.qmd
          - knowledge/physiology/reference/12-dawn-phenomenon.qmd
          - knowledge/physiology/reference/13-somogyi-effect.qmd
          - knowledge/physiology/reference/14-diurnal-variation-isf.qmd
          - knowledge/physiology/reference/15-menstrual-cycle.qmd
          - knowledge/physiology/reference/16-seasonal-variation.qmd
          - knowledge/physiology/reference/17-illness-infection.qmd
          - knowledge/physiology/reference/18-sleep-deprivation.qmd
          - knowledge/physiology/reference/19-alcohol.qmd
          - knowledge/physiology/reference/20-psychological-stress.qmd
          - knowledge/physiology/reference/21-temperature-climate.qmd
          - knowledge/physiology/reference/22-injection-site.qmd
          - knowledge/physiology/reference/23-ketones-dka.qmd
          - knowledge/physiology/reference/24-insulin-overdose.qmd
          - knowledge/physiology/reference/25-nonlinear-insulin.qmd
          - knowledge/physiology/reference/26-glucotoxicity.qmd
          - knowledge/physiology/reference/27-cgm-technology.qmd
          - knowledge/physiology/reference/28-mathematical-models.qmd
          - knowledge/physiology/reference/29-model-comparison.qmd
      - section: "Regulation and responsible development"
        contents:
          - knowledge/regulation/regulatory-boundaries.qmd
      - section: "Adoption and sustainability"
        contents:
          - knowledge/sustainability/index.qmd
          - knowledge/sustainability/why-games-disappear.qmd
          - knowledge/sustainability/maintenance-patterns.qmd
      - section: "Methods and sources"
        contents:
          - methods.qmd
          - references/SOURCE-INDEX.md
          - references/ELIGIBILITY-DECISIONS.md
          - references/PAYWALLED-WISHLIST.md
          - docs/reviews/2026-09-06_scientific-content-audit/full-text-backlog.md

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    code-copy: true

lang: en
date-format: "D MMMM YYYY"
