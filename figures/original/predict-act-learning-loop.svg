<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Predict, act, observe, explain, retry, and vary learning loop</title>
  <desc id="desc">Six rounded boxes form a clockwise sequence. Predict leads to act, observe, explain, retry, vary, and then back to predict.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#587085"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173b5d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f5f9fb"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#173b5d">Hypothesis-driven learning loop</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#5c6f82">Repeat a controlled scenario, then vary one condition to test transfer</text>

  <g fill="none" stroke="#587085" stroke-width="4" marker-end="url(#arrow)">
    <path d="M330 210 H430"/>
    <path d="M700 210 H800"/>
    <path d="M935 270 V365"/>
    <path d="M800 435 H700"/>
    <path d="M430 435 H330"/>
    <path d="M195 365 V300 C195 280 195 280 195 270"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, sans-serif">
    <g>
      <rect x="60" y="145" width="270" height="125" rx="20" fill="#e6f0fb" stroke="#2563a6" stroke-width="2"/>
      <circle cx="100" cy="184" r="19" fill="#2563a6"/>
      <text x="100" y="191" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text>
      <text x="135" y="191" font-size="24" font-weight="700" fill="#173b5d">Predict</text>
      <text x="92" y="229" font-size="16" fill="#456278">State the expected trajectory</text>
    </g>
    <g>
      <rect x="430" y="145" width="270" height="125" rx="20" fill="#e6f0fb" stroke="#2563a6" stroke-width="2"/>
      <circle cx="470" cy="184" r="19" fill="#2563a6"/>
      <text x="470" y="191" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text>
      <text x="505" y="191" font-size="24" font-weight="700" fill="#173b5d">Act</text>
      <text x="462" y="229" font-size="16" fill="#456278">Change one interpretable input</text>
    </g>
    <g>
      <rect x="800" y="145" width="270" height="125" rx="20" fill="#e1f4f1" stroke="#087f7a" stroke-width="2"/>
      <circle cx="840" cy="184" r="19" fill="#087f7a"/>
      <text x="840" y="191" text-anchor="middle" font-size="18" font-weight="700" fill="white">3</text>
      <text x="875" y="191" font-size="24" font-weight="700" fill="#173b5d">Observe</text>
      <text x="832" y="229" font-size="16" fill="#456278">Inspect timing and consequence</text>
    </g>
    <g>
      <rect x="800" y="365" width="270" height="140" rx="20" fill="#fff2d5" stroke="#a76204" stroke-width="2"/>
      <circle cx="840" cy="406" r="19" fill="#a76204"/>
      <text x="840" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="white">4</text>
      <text x="875" y="413" font-size="24" font-weight="700" fill="#173b5d">Explain</text>
      <text x="832" y="450" font-size="16" fill="#456278">Connect response to mechanism</text>
      <text x="832" y="477" font-size="15" fill="#6a5b38">State uncertainty and model limits</text>
    </g>
    <g>
      <rect x="430" y="365" width="270" height="140" rx="20" fill="#e6f0fb" stroke="#2563a6" stroke-width="2"/>
      <circle cx="470" cy="406" r="19" fill="#2563a6"/>
      <text x="470" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="white">5</text>
      <text x="505" y="413" font-size="24" font-weight="700" fill="#173b5d">Retry</text>
      <text x="462" y="450" font-size="16" fill="#456278">Restore the initial conditions</text>
      <text x="462" y="477" font-size="15" fill="#456278">Revise the action or hypothesis</text>
    </g>
    <g>
      <rect x="60" y="365" width="270" height="140" rx="20" fill="#eee9fb" stroke="#7255ad" stroke-width="2"/>
      <circle cx="100" cy="406" r="19" fill="#7255ad"/>
      <text x="100" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="white">6</text>
      <text x="135" y="413" font-size="24" font-weight="700" fill="#173b5d">Vary</text>
      <text x="92" y="450" font-size="16" fill="#456278">Alter one contextual factor</text>
      <text x="92" y="477" font-size="15" fill="#5c4d7b">Test transfer, not memorisation</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#536a7d">
    <circle cx="320" cy="572" r="8" fill="#2563a6"/><text x="337" y="577">Learner decision</text>
    <circle cx="510" cy="572" r="8" fill="#087f7a"/><text x="527" y="577">Observable response</text>
    <circle cx="710" cy="572" r="8" fill="#a76204"/><text x="727" y="577">Explanatory support</text>
    <circle cx="918" cy="572" r="8" fill="#7255ad"/><text x="935" y="577">Transfer variation</text>
  </g>
</svg>
